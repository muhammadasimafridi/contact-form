<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Replace 'your@email.com' with your actual email address -->
  <!-- <form action="https://formsubmit.co/your@email.com" method="POST" class="contact-form"> -->
  <form action="https://formsubmit.co/officialasimafridi@gmail.com" method="POST" class="contact-form">
    
    <!-- FormSubmit Hidden Configurations (Optional but recommended) -->
    <input type="hidden" name="_subject" value="New Contact Form Submission!">
    <input type="hidden" name="_captcha" value="false">
    <!-- <input type="hidden" name="_template" value="table"> -->

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="How can we help?" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
    </div>

    <!-- Add this line inside your <form> tags -->
    <!-- <input type="hidden" name="_next" value="https://your-website.com/thank-you.html"> -->
    <!-- <input type="hidden" name="_next" value="https://contact-form-navy.vercel.app/"> -->

    <button type="submit" class="submit-btn">Send Message</button>
  </form>

</body>
</html>
